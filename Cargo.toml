[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.1.24"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/Padishar24/tessera"

[workspace.dependencies]
tessera-core = { path = "crates/tessera-core" }
tessera-win = { path = "crates/tessera-win" }
tessera-editor = { path = "crates/tessera-editor" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "7"
# glow instead of wgpu: only with it are transparent windows reliable on Windows.
eframe = { version = "0.35", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
embed-resource = "3"
notify = "8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"
toml_edit = "0.25"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tray-icon = "0.26"
windows = "0.62"
winvd = "0.0.49"

[profile.release]
lto = "thin"
codegen-units = 1

[workspace.lints.clippy]
# Every unsafe block needs a `// SAFETY:` comment (CI fails otherwise).
undocumented_unsafe_blocks = "warn"
